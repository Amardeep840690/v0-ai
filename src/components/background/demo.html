<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AnimatedBackground preview</title>
<style>
/**
 * background.css
 *
 * Premium ambient background system — AnimatedBackground, GlowLayer,
 * MeshOverlay, FloatingParticles, NoiseOverlay.
 *
 * Non-negotiables enforced throughout this file:
 *  - SVG paths are never animated. Only transform / translate / scale /
 *    opacity are animated, so everything compositor-only (GPU).
 *  - Every color is a CSS variable; dark mode is a dedicated palette, not
 *    an inversion of light mode.
 *  - Motion is slow (30-48s) and small in magnitude — it should be felt,
 *    not seen.
 */

:root {
  /* ---- Brand palette (exact spec values) -------------------------- */
  --emerald-primary-rgb: 16, 110, 59; /* #106E3B */
  --emerald-accent-rgb: 58, 167, 109; /* #3AA76D */
  --champagne-rgb: 248, 231, 201; /* #F8E7C9 */

  /* ---- Surfaces ------------------------------------------------------ */
  --bg-color: #fcfbf8;
  --bg-surface: #f4f1ea;
  --bg-card: #ffffff;

  /* ---- Glow layer (Layer 1 & 2 + depth accents) ----------------------- */
  --glow-emerald-primary: rgba(var(--emerald-primary-rgb), 0.08);
  --glow-emerald-accent: rgba(var(--emerald-accent-rgb), 0.05);
  --glow-champagne-primary: rgba(var(--champagne-rgb), 0.06);
  --glow-champagne-accent: rgba(var(--champagne-rgb), 0.035);

  /* ---- Mesh contour lines --------------------------------------------- */
  --mesh-color-rgb: var(--emerald-primary-rgb);
  --mesh-base-opacity: 0.55;

  /* ---- Particles -------------------------------------------------------- */
  --particle-white: rgba(255, 255, 255, 0.9);
  --particle-emerald: rgba(var(--emerald-accent-rgb), 0.9);
  --particle-champagne: rgba(214, 180, 120, 0.9);

  /* ---- Noise + vignette --------------------------------------------- */
  --noise-opacity: 0.01;
  --vignette-edge: rgba(0, 0, 0, 0.08);
  --vignette-center: rgba(255, 255, 255, 0.02);

  color-scheme: light;
}

.dark {
  --bg-color: #090b0a;
  --bg-surface: #121412;
  --bg-card: #181b18;

  /* Emerald glow slightly stronger, champagne much weaker */
  --glow-emerald-primary: rgba(var(--emerald-accent-rgb), 0.14);
  --glow-emerald-accent: rgba(var(--emerald-accent-rgb), 0.08);
  --glow-champagne-primary: rgba(var(--champagne-rgb), 0.025);
  --glow-champagne-accent: rgba(var(--champagne-rgb), 0.015);

  /* White contour lines in dark mode */
  --mesh-color-rgb: 255, 255, 255;
  --mesh-base-opacity: 0.4;

  --particle-white: rgba(255, 255, 255, 0.85);
  --particle-emerald: rgba(var(--emerald-accent-rgb), 0.85);
  --particle-champagne: rgba(248, 231, 201, 0.55);

  /* Noise slightly more visible */
  --noise-opacity: 0.022;
  --vignette-edge: rgba(0, 0, 0, 0.45);
  --vignette-center: rgba(255, 255, 255, 0.015);

  color-scheme: dark;
}

/* ---------------------------------------------------------------------- */
/* Root container                                                         */
/* ---------------------------------------------------------------------- */

.bg-root {
  position: fixed;
  inset: 0;
  z-index: -10;
  overflow: hidden;
  pointer-events: none;
  contain: paint;
  background: var(--bg-color);
}

/* ---------------------------------------------------------------------- */
/* GlowLayer — depth via stacked blur radii, opacities and z-index        */
/* ---------------------------------------------------------------------- */

.bg-glow-layer {
  position: absolute;
  inset: 0;
  contain: paint;
}

.bg-glow {
  position: absolute;
  border-radius: 50%;
  transform: translateZ(0);
  will-change: transform, opacity;
  backface-visibility: hidden;
}

/* Layer 1 — large emerald glow from the left, very soft, ~8% */
.bg-glow--emerald-primary {
  z-index: 1;
  top: 8%;
  left: -18%;
  width: 60%;
  height: 78%;
  background: radial-gradient(ellipse at center, var(--glow-emerald-primary) 0%, transparent 70%);
  filter: blur(90px);
  animation: bg-drift-1 42s ease-in-out infinite;
}

/* Depth accent riding alongside layer 1, tighter blur, accent emerald */
.bg-glow--emerald-accent {
  z-index: 2;
  top: 22%;
  left: -6%;
  width: 30%;
  height: 40%;
  background: radial-gradient(ellipse at center, var(--glow-emerald-accent) 0%, transparent 65%);
  filter: blur(60px);
  animation: bg-drift-2 30s ease-in-out infinite;
}

/* Layer 2 — large champagne glow from the opposite corner, ~6% */
.bg-glow--champagne-primary {
  z-index: 1;
  bottom: -14%;
  right: -16%;
  width: 58%;
  height: 70%;
  background: radial-gradient(ellipse at center, var(--glow-champagne-primary) 0%, transparent 70%);
  filter: blur(100px);
  animation: bg-drift-3 48s ease-in-out infinite;
}

/* Depth accent for the champagne corner */
.bg-glow--champagne-accent {
  z-index: 2;
  top: 4%;
  right: 6%;
  width: 26%;
  height: 32%;
  background: radial-gradient(ellipse at center, var(--glow-champagne-accent) 0%, transparent 65%);
  filter: blur(70px);
  animation: bg-drift-4 36s ease-in-out infinite;
}

/* Every drift keyframe moves only transform + opacity, in tiny amounts.
   Durations are deliberately mismatched (30/36/42/48s) so the layers never
   sync up — the page should feel alive, not "breathing" on a beat. */

@keyframes bg-drift-1 {
  0%,
  100% {
    transform: translate3d(0, 0, 0) scale(1);
    opacity: 0.9;
  }
  50% {
    transform: translate3d(2.5%, -1.8%, 0) scale(1.06);
    opacity: 1;
  }
}

@keyframes bg-drift-2 {
  0%,
  100% {
    transform: translate3d(0, 0, 0) scale(1);
    opacity: 0.75;
  }
  50% {
    transform: translate3d(-2%, 2.2%, 0) scale(1.09);
    opacity: 0.95;
  }
}

@keyframes bg-drift-3 {
  0%,
  100% {
    transform: translate3d(0, 0, 0) scale(1);
    opacity: 0.85;
  }
  50% {
    transform: translate3d(-2.2%, -1.5%, 0) scale(1.05);
    opacity: 1;
  }
}

@keyframes bg-drift-4 {
  0%,
  100% {
    transform: translate3d(0, 0, 0) scale(1);
    opacity: 0.7;
  }
  50% {
    transform: translate3d(1.6%, 1.8%, 0) scale(1.07);
    opacity: 0.9;
  }
}

/* ---------------------------------------------------------------------- */
/* MeshOverlay — organic contour curves, faded via mask + gradient stroke */
/* ---------------------------------------------------------------------- */

.bg-mesh {
  position: absolute;
  inset: 0;
  z-index: 3;
  opacity: var(--mesh-base-opacity);
  contain: paint;
  mask-image: radial-gradient(ellipse 78% 72% at 50% 48%, black 25%, transparent 90%);
  -webkit-mask-image: radial-gradient(ellipse 78% 72% at 50% 48%, black 25%, transparent 90%);
}

.bg-mesh svg {
  width: 100%;
  height: 100%;
  color: rgb(var(--mesh-color-rgb));
}

.bg-mesh path {
  fill: none;
  stroke-linecap: round;
}

/* ---------------------------------------------------------------------- */
/* FloatingParticles — static position, opacity-only pulse                */
/* ---------------------------------------------------------------------- */

.bg-particles {
  position: absolute;
  inset: 0;
  z-index: 4;
  contain: paint;
}

.bg-particle {
  position: absolute;
  border-radius: 50%;
  transform: translateZ(0);
  will-change: opacity;
  animation-name: bg-particle-pulse;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
  /* duration + delay are set per-particle via inline custom properties */
  animation-duration: var(--pulse-duration, 6s);
  animation-delay: var(--pulse-delay, 0s);
}

.bg-particle--white {
  background: var(--particle-white);
}

.bg-particle--emerald {
  background: var(--particle-emerald);
}

.bg-particle--champagne {
  background: var(--particle-champagne);
}

@keyframes bg-particle-pulse {
  0%,
  100% {
    opacity: var(--base-opacity, 0.3);
  }
  50% {
    opacity: calc(var(--base-opacity, 0.3) * 0.35);
  }
}

/* ---------------------------------------------------------------------- */
/* NoiseOverlay — lightweight CSS grain, no SVG turbulence filter          */
/* ---------------------------------------------------------------------- */

.bg-noise {
  position: absolute;
  inset: 0;
  z-index: 5;
  opacity: var(--noise-opacity);
  contain: paint;
  background-image: radial-gradient(circle, #808080 0.6px, transparent 0.6px);
  background-size: 3px 3px;
  background-repeat: repeat;
  mix-blend-mode: overlay;
  transform: translateZ(0);
}

/* ---------------------------------------------------------------------- */
/* Vignette — edges darker, center brighter                               */
/* ---------------------------------------------------------------------- */

.bg-vignette {
  position: absolute;
  inset: 0;
  z-index: 6;
  background: radial-gradient(
    ellipse 80% 80% at 50% 45%,
    var(--vignette-center) 0%,
    transparent 45%,
    var(--vignette-edge) 100%
  );
}

/* ---------------------------------------------------------------------- */
/* Reduced motion                                                         */
/* ---------------------------------------------------------------------- */

@media (prefers-reduced-motion: reduce) {
  .bg-glow,
  .bg-particle {
    animation: none !important;
  }
}

html, body { margin: 0; height: 100%; font-family: -apple-system, "Inter", "Helvetica Neue", Arial, sans-serif; }

.preview-toggle {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 50;
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid rgba(120,120,120,0.25);
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(6px);
  cursor: pointer;
  font-size: 13px;
}
.dark .preview-toggle { background: rgba(255,255,255,0.06); color: #eee; }

.mock-shell { position: relative; z-index: 10; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.mock-card {
  width: 460px;
  padding: 32px;
  border-radius: 16px;
  background: color-mix(in srgb, var(--bg-card) 70%, transparent);
  border: 1px solid rgba(120,120,120,0.14);
  box-shadow: 0 20px 60px rgba(0,0,0,0.06);
  backdrop-filter: blur(14px);
}
.dark .mock-card { box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
.mock-eyebrow { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: rgb(var(--emerald-accent-rgb)); margin: 0 0 8px; }
.mock-title { font-size: 26px; font-weight: 600; margin: 0 0 10px; color: #1c1e1c; }
.dark .mock-title { color: #f3f2ee; }
.mock-body { font-size: 14px; line-height: 1.6; color: #55564f; margin: 0 0 20px; }
.dark .mock-body { color: #a9aca5; }
.mock-btn { display: inline-block; padding: 10px 18px; border-radius: 8px; background: #106E3B; color: white; font-size: 13px; font-weight: 500; text-decoration: none; }
</style>
